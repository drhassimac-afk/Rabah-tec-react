name: 🚀 Build RabahTec React APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📦 Install Expo and EAS
        run: |
          npm install -g expo-cli@6.3.10
          npm install -g eas-cli

      - name: 🔑 Expo Login
        run: |
          echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV
          echo "EXPO_USERNAME=${{ secrets.EXPO_USERNAME }}" >> $GITHUB_ENV
          npx expo login --non-interactive -u ${{ secrets.EXPO_USERNAME }} -p ${{ secrets.EXPO_PASSWORD }} || true

      - name: 🏗️ Build Android APK
        run: |
          export EAS_SKIP_AUTO_FINGERPRINT=1
          npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rabah-tec-react-android-${{ github.sha }}
          path: |
            *.apk
            **/*.apk
            build-*.apk
            ./*.apk
          retention-days: 30

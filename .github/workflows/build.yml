name: 🚀 Build RabahTec React APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm install -g expo-cli
          npm ci

      - name: 🔧 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build Android APK
        run: |
          npx expo install
          EAS_SKIP_AUTO_FINGERPRINT=1 npx eas-cli build --platform android --profile preview --non-interactive

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rabah-tec-react-android-${{ github.sha }}
          path: |
            *.apk
            **/*.apk
            build-*.apk
          retention-days: 30

      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            *.log
            build-*.log
          retention-days: 7
